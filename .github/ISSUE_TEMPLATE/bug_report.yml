name: Bug report
description: Something renders wrong, crashes, freezes, or performs worse than the stock driver
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in the device and the log. Without those a report cannot be
        acted on, and it will be closed rather than left open indefinitely.
  - type: input
    id: device
    attributes:
      label: Device and GPU
      description: Model, and the Mali number if you know it.
      placeholder: Anbernic RG556, Mali-G57
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android and firmware version
      description: Say so if you run a custom kernel or ROM.
      placeholder: Android 13
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: Driver version
      description: The release you downloaded. "Latest" is not a version.
      placeholder: v0.11.0
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: App loading the driver
      description: The app and its version.
    validations:
      required: true
  - type: dropdown
    id: stock
    attributes:
      label: Does the same thing happen on the stock Mali driver?
      description: >-
        Switch the driver back and try again. This single answer decides whether
        the bug is in this driver at all, and it saves everyone a lot of time.
      options:
        - "No, only with this driver"
        - "Yes, it happens on the stock driver too"
        - "I have not tried"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        `adb logcat` covering the moment it went wrong. If the app died, the
        lines beginning `F DEBUG` are the important ones. Lines beginning
        `E MESA` come from the driver. Paste as text, not a screenshot.
      render: shell
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or video
      description: Helpful for rendering bugs. Optional.
