name: Device report
description: Tell me it works (or does not) on a device I do not own
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: |
        I only own one Anbernic RG556, so every number in the README comes from
        that one device. Reports from other hardware, firmware, or kernels are
        the most useful thing you can contribute.
  - type: input
    id: device
    attributes:
      label: Device, GPU, and firmware
      placeholder: <model>, Mali-<number>, <firmware or kernel>
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - "Works, renders correctly"
        - "Loads but renders wrong"
        - "Crashes"
        - "Freezes the device"
        - "Will not load at all"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: What you ran, and anything you measured against the stock driver.
